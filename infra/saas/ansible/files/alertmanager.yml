# dropicture/infra/saas/ansible/files/alertmanager.yml
global:
  resolve_timeout: 5m
  # Envoi par SMTP. Le mot de passe est fourni par un secret Docker (jamais dans le dépôt),
  # à créer sous le nom dropicture_alertmanager_smtp_password et monté sur /run/secrets/.
  smtp_smarthost: "smtp-mail.outlook.com:587"
  smtp_from: "a.redjem@outlook.com"
  smtp_auth_username: "a.redjem@outlook.com"
  smtp_auth_password_file: "/run/secrets/alertmanager_smtp_password"
  smtp_require_tls: true

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: email
  routes:
    - matchers:
        - severity = "critical"
      receiver: email
      repeat_interval: 1h

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ["alertname", "node"]

receivers:
  - name: email
    email_configs:
      - to: "a.redjem@outlook.com"
        send_resolved: true
        headers:
          subject: '[dropicture] {{ .Status | toUpper }} · {{ .CommonLabels.alertname }}'
    # Extension possible, webhook vers une messagerie d'équipe :
    # webhook_configs:
    #   - url: "https://exemple.invalid/hook"
    #     send_resolved: true

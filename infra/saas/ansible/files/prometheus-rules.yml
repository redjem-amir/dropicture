# dropicture/infra/saas/ansible/files/prometheus-rules.yml
groups:
  - name: dropicture.energie
    interval: 30s
    rules:
      - record: node:cpu_utilization:ratio
        expr: clamp_min(1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m])), 0)

      - record: node:power_watts:estimate
        expr: |
          count by (node) (node_cpu_seconds_total{mode="idle"})
          * (1.5 + 4.5 * clamp_min(1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m])), 0))

      - record: cluster:power_watts:estimate
        expr: sum(node:power_watts:estimate)

      - record: cluster:energy_kwh_daily:estimate
        expr: sum(node:power_watts:estimate) * 24 / 1000

      - record: cluster:carbon_grams_per_hour:estimate
        expr: sum(node:power_watts:estimate) * 0.38

  - name: dropicture.alertes.energie
    rules:
      - alert: ConsommationEnergetiqueElevee
        expr: cluster:power_watts:estimate > 200
        for: 15m
        labels:
          severity: warning
          domaine: green-it
        annotations:
          summary: 'Consommation électrique estimée élevée ({{ $value | printf "%.0f" }} W)'
          description: >-
            La puissance estimée du cluster dépasse 200 W depuis 15 min.
            Vérifier les charges anormales (boucle CPU, scraping, batch) et
            envisager un redimensionnement (right-sizing) des services.

  - name: dropicture.alertes.disponibilite
    rules:
      - alert: CibleInjoignable
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Cible {{ $labels.job }} injoignable ({{ $labels.instance }})"
          description: "Prometheus ne scrape plus {{ $labels.job }} depuis 5 min."

      - alert: NoeudInjoignable
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Nœud {{ $labels.node }} injoignable"
          description: "node-exporter ne répond plus sur {{ $labels.node }} depuis 5 min."

  - name: dropicture.alertes.noeuds
    rules:
      - alert: ChargeCpuElevee
        expr: node:cpu_utilization:ratio > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU > 90 % sur {{ $labels.node }}"
          description: "Le nœud {{ $labels.node }} est à plus de 90 % de CPU depuis 15 min."

      - alert: MemoireFaible
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Mémoire disponible < 10 % sur {{ $labels.node }}"
          description: "Moins de 10 % de RAM disponible sur {{ $labels.node }} depuis 15 min."

      - alert: DisqueBientotPlein
        expr: |
          predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.2
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Disque / bientôt plein sur {{ $labels.node }}"
          description: "À la tendance actuelle, la partition / de {{ $labels.node }} sera pleine sous 24 h."

      - alert: DisqueSatureCritique
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Disque / à plus de 90 % sur {{ $labels.node }}"
          description: "Moins de 10 % d'espace libre sur / ({{ $labels.node }})."

  - name: dropicture.alertes.application
    rules:
      - alert: TauxErreurs5xxEleve
        expr: |
          sum(rate(traefik_service_requests_total{code=~"5.."}[5m]))
          /
          sum(rate(traefik_service_requests_total[5m])) > 0.05
          and sum(rate(traefik_service_requests_total[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Plus de 5 % d'erreurs 5xx"
          description: "Le taux d'erreurs serveur (5xx) dépasse 5 % depuis 10 min."

      - alert: LatenceP95Elevee
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(traefik_service_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 > 1 s"
          description: "La latence au 95e percentile dépasse 1 s depuis 10 min."

      - alert: ConteneurRedemarrageFrequent
        expr: changes(container_start_time_seconds{container_label_com_docker_swarm_service_name!=""}[15m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redémarrages fréquents : {{ $labels.container_label_com_docker_swarm_service_name }}"
          description: "Le service a redémarré plus de 2 fois en 15 min (crash loop probable)."

# dropicture/apps/saas/backend/docker-compose.yml
services:
  dropicture-saas-postgres:
    container_name: dropicture-saas-postgres
    image: postgres:18.4
    command:
      - "postgres"
      - "-c"
      - "statement_timeout=30000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB_DROPICTURE_SAAS}
      POSTGRES_USER: ${POSTGRES_USER_DROPICTURE_SAAS}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DROPICTURE_SAAS}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dropicture_saas:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER_DROPICTURE_SAAS}",
          "-d",
          "${POSTGRES_DB_DROPICTURE_SAAS}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  dropicture-saas-pgbouncer:
    container_name: dropicture-saas-pgbouncer
    image: edoburu/pgbouncer:v1.24.1-p1
    depends_on:
      dropicture-saas-postgres:
        condition: service_healthy
    environment:
      DB_HOST: dropicture-saas-postgres
      DB_NAME: ${POSTGRES_DB_DROPICTURE_SAAS}
      DB_USER: ${POSTGRES_USER_DROPICTURE_SAAS}
      DB_PASSWORD: ${POSTGRES_PASSWORD_DROPICTURE_SAAS}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: "6432"
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "50"
      MAX_PREPARED_STATEMENTS: "200"
      ADMIN_USERS: ${POSTGRES_USER_DROPICTURE_SAAS}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "6432:6432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  dropicture-saas-redis-cache:
    container_name: dropicture-saas-redis-cache
    image: redis:8.8.0-alpine
    command:
      - "redis-server"
      - "--protected-mode"
      - "no"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dropicture_saas:
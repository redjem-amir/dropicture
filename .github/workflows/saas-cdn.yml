name: SaaS Cdn

on:
  workflow_dispatch:
    inputs:
      drop_signing_keys:
        description: "Migration unique : détruire les clés de signature CloudFront (tls/public_key/key_group/KMS). À cocher UNE seule fois, puis remettre à false."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: saas-cdn
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  TF_DIR: infra/saas/terraform
  STATE_BUCKET: dropicture-tfstate-prod
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    name: Deploy CDN
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_hcloud_token: ${{ secrets.TF_VAR_HCLOUD_TOKEN }}
      TF_VAR_ssh_public_key_b64: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Le déploiement doit partir de main (la clé d'état est figée)."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<1.12.0"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create state bucket if missing
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "State bucket $STATE_BUCKET already exists — nothing to do."
            exit 0
          fi
          echo "Creating state bucket $STATE_BUCKET in $AWS_REGION ..."
          if [ "$AWS_REGION" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
          else
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi
          aws s3api wait bucket-exists --bucket "$STATE_BUCKET"
          aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          echo "State bucket ready."

      - name: terraform fmt / init / validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -lock-timeout=5m
          terraform validate

      - name: terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          TARGETS=(
            aws_s3_bucket_public_access_block.cdn
            aws_s3_bucket_ownership_controls.cdn
            aws_s3_bucket_server_side_encryption_configuration.cdn
            aws_s3_bucket_versioning.cdn
            aws_s3_bucket_lifecycle_configuration.cdn
            aws_s3_bucket_cors_configuration.cdn
            aws_s3_bucket_policy.cdn
            aws_cloudfront_distribution.cdn
            cloudflare_dns_record.cdn
            aws_ssm_parameter.cdn_config
            aws_s3_bucket_public_access_block.db_backups
            aws_s3_bucket_ownership_controls.db_backups
            aws_s3_bucket_server_side_encryption_configuration.db_backups
            aws_s3_bucket_versioning.db_backups
            aws_s3_bucket_object_lock_configuration.db_backups
            aws_s3_bucket_lifecycle_configuration.db_backups
            aws_s3_bucket_policy.db_backups
            aws_ssm_parameter.db_backup_config
          )

          # Migration unique : ces adresses ne sont plus dans la configuration,
          # mais sont encore dans le state. Les cibler explicitement force leur
          # destruction dans ce run plutôt que de les laisser orphelines.
          if [ "${{ inputs.drop_signing_keys }}" = "true" ]; then
            echo "::notice::Destruction des clés de signature CloudFront demandée."
            TARGETS+=(
              tls_private_key.cloudfront
              aws_cloudfront_public_key.cdn
              aws_cloudfront_key_group.cdn
              aws_kms_key.cdn_secrets
              aws_kms_alias.cdn_secrets
              aws_ssm_parameter.cloudfront_private_key
              aws_ssm_parameter.cloudfront_key_pair_id
              aws_ssm_parameter.cloudfront_active_key_version
            )
          fi

          printf -v FLAGS -- "-target=%s " "${TARGETS[@]}"

          set +e
          terraform plan -lock-timeout=5m -detailed-exitcode -out=cdn.tfplan $FLAGS
          CODE=$?
          set -e
          case "$CODE" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$CODE" ;;
          esac

          {
            echo "## Plan CDN — ${#TARGETS[@]} cibles"
            echo ""
            echo "> La partie Hetzner est hors périmètre : les nœuds, le réseau"
            echo "> et le firewall ne sont ni lus ni modifiés."
            echo ""
            echo '```'
            terraform show -no-color cdn.tfplan | grep -E '^  # |^Plan:|^No changes' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guard destructive plan
        if: ${{ steps.plan.outputs.has_changes == 'true' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          FORBIDDEN=$(terraform show -json cdn.tfplan \
            | jq -r '.resource_changes[]
                     | select(.change.actions | index("delete"))
                     | select(.type | test("^(hcloud_|aws_s3_bucket$|aws_cloudfront_distribution$)"))
                     | .address')
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Le plan détruirait des ressources critiques :"
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: terraform apply
        if: ${{ steps.plan.outputs.has_changes == 'true' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -lock-timeout=5m cdn.tfplan

      - name: Report outputs
        if: ${{ steps.plan.outputs.has_changes == 'true' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          {
            echo "### Déployé"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| CDN | \`$(terraform output -raw cdn_url)\` |"
            echo "| Distribution | \`$(terraform output -raw cdn_distribution_id)\` |"
            echo "| Bucket | \`$(terraform output -raw cdn_bucket)\` |"
            echo "| Préfixe servi | \`$(terraform output -raw cdn_public_prefix)/\` |"
            echo "| Préfixe SSM | \`$(terraform output -raw cdn_ssm_prefix)\` |"
            echo "| Sauvegardes | \`$(terraform output -raw db_backup_bucket)\` |"
            echo ""
            echo "Appliqué par @${{ github.actor }}."
            echo ""
            echo "Seul \`media/\` est servi par CloudFront ; \`originals/\` n'est"
            echo "accessible qu'via les credentials IAM du backend et des jobs."
          } >> "$GITHUB_STEP_SUMMARY"
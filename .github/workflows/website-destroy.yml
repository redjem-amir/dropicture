# dropicture/.github/workflows/website-destroy.yml
name: Website Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'DESTROY everything — type "destroy" to confirm'
        required: true
        type: string
        default: ""
      delete_state_bucket:
        description: "Also delete the Terraform state bucket (only runs if the destroy succeeded)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  TF_DIR: infra/website/terraform
  STATE_BUCKET: dropicture-website-tfstate-prod
  TF_STATE_KEY: terraform.tfstate
  WEBSITE_BUCKET: dropicture-website-prod
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  guard:
    name: Confirm intent
    runs-on: ubuntu-latest
    steps:
      - name: Check branch and confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Destroy must be run from the main branch (the state key is fixed)."
            exit 1
          fi
          if [ "$CONFIRM" != "destroy" ]; then
            echo "Confirmation failed: type 'destroy' exactly to proceed."
            exit 1
          fi
          echo "Confirmed."

  tf-destroy:
    name: Terraform destroy
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<1.12.0"
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install boto3
        run: pip install --no-cache-dir boto3

      - name: Empty the website bucket
        run: |
          python - <<'PY'
          import os

          import boto3
          from botocore.exceptions import ClientError

          name = os.environ["WEBSITE_BUCKET"]
          bucket = boto3.resource("s3", region_name=os.environ["AWS_REGION"]).Bucket(name)

          try:
              bucket.meta.client.head_bucket(Bucket=name)
          except ClientError as exc:
              if exc.response["Error"]["Code"] in ("404", "NoSuchBucket"):
                  print(f"Bucket {name} does not exist — nothing to empty.")
                  raise SystemExit(0)
              raise

          print(f"Emptying {name} (objects, versions, delete markers) ...")
          bucket.object_versions.delete()
          print("Website bucket emptied.")
          PY

      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: terraform plan -destroy (preview)
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -destroy -no-color

      - name: terraform destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve

  state-teardown:
    name: Delete state bucket
    needs: tf-destroy
    if: inputs.delete_state_bucket
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install boto3
        run: pip install --no-cache-dir boto3
      - name: Empty and delete the state bucket
        run: |
          python - <<'PY'
          import os

          import boto3
          from botocore.exceptions import ClientError

          name = os.environ["STATE_BUCKET"]
          bucket = boto3.resource("s3", region_name=os.environ["AWS_REGION"]).Bucket(name)

          try:
              bucket.meta.client.head_bucket(Bucket=name)
          except ClientError as exc:
              if exc.response["Error"]["Code"] in ("404", "NoSuchBucket"):
                  print(f"Bucket {name} does not exist — nothing to do.")
                  raise SystemExit(0)
              raise

          print(f"Emptying all versions and delete markers in {name} ...")
          bucket.object_versions.delete()
          print(f"Deleting bucket {name} ...")
          bucket.delete()
          print("State bucket deleted.")
          PY
name: SaaS Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  TF_DIR: infra/saas/terraform
  STATE_BUCKET: dropicture-tfstate-prod
  ANSIBLE_DIR: infra/saas/ansible
  IMAGE_NAMESPACE: ghcr.io/redjem-amir/dropicture/saas
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TRIVY_VERSION: v0.58.2
  TRIVY_BLOCKING_SEVERITY: CRITICAL,HIGH

jobs:
  checks:
    name: Validate & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<1.12.0"
          terraform_wrapper: false
      - name: terraform fmt / validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/saas/backend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        working-directory: apps/saas/backend
        run: bun install --frozen-lockfile
      - name: Run Jest
        working-directory: apps/saas/backend
        run: bun run test --ci

      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          trivy --version
      - name: Cache the Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-db-${{ env.TRIVY_VERSION }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-trivy-db-${{ env.TRIVY_VERSION }}-

      - name: Trivy - dependances et secrets (bloquant)
        run: |
          set -euo pipefail
          trivy fs . \
            --scanners vuln,secret \
            --severity "${TRIVY_BLOCKING_SEVERITY}" \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --skip-dirs node_modules --skip-dirs dist --skip-dirs .git \
            --cache-dir ~/.cache/trivy
      - name: Trivy - configuration IaC Terraform / Ansible / Dockerfile (bloquant)
        run: |
          set -euo pipefail
          trivy config . \
            --severity "${TRIVY_BLOCKING_SEVERITY}" \
            --exit-code 1 \
            --format table \
            --skip-dirs node_modules --skip-dirs .git \
            --cache-dir ~/.cache/trivy

      - name: Trivy - rapports SARIF du depot
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports
          trivy fs . --scanners vuln,secret --format sarif --output reports/trivy-repo.sarif \
            --skip-dirs node_modules --skip-dirs dist --skip-dirs .git --cache-dir ~/.cache/trivy
          trivy config . --format sarif --output reports/trivy-config.sarif \
            --skip-dirs node_modules --skip-dirs .git --cache-dir ~/.cache/trivy
      - name: Publier les resultats dans GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports
          category: trivy-repo
      - name: Archiver les rapports Trivy du depot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-repo-reports
          path: reports/
          retention-days: 90

  versions:
    name: Resolve image tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive one tag per service from its last commit
        id: tags
        run: |
          set -euo pipefail
          declare -A sha
          for svc in frontend backend; do
            s=$(git log -1 --format=%H -- "apps/saas/$svc")
            if [ -z "$s" ]; then
              echo "::error::no commit found touching apps/saas/$svc"
              exit 1
            fi
            sha[$svc]=$s
            echo "$svc -> $s"
          done
          tags=$(jq -nc \
            --arg frontend "${sha[frontend]}" \
            --arg backend  "${sha[backend]}" \
            '{frontend: $frontend, backend: $backend}')
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          {
            echo "| Service | Tag |"
            echo "|---|---|"
            for svc in frontend backend; do
              echo "| $svc | \`${sha[$svc]:0:12}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Terraform
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    env:
      TF_VAR_hcloud_token: ${{ secrets.TF_VAR_HCLOUD_TOKEN }}
      TF_VAR_ssh_public_key_b64: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY_B64 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create state bucket if missing
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "State bucket $STATE_BUCKET already exists nothing to do."
            exit 0
          fi
          echo "Creating state bucket $STATE_BUCKET in $AWS_REGION ..."
          if [ "$AWS_REGION" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
          else
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi
          aws s3api wait bucket-exists --bucket "$STATE_BUCKET"
          aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          echo "State bucket ready."

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<1.12.0"
          terraform_wrapper: false

      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -lock-timeout=5m

      - name: terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          # -detailed-exitcode : 0 = aucun changement, 1 = erreur, 2 = changements
          exitcode=0
          terraform plan -detailed-exitcode -lock-timeout=5m -out=tfplan || exitcode=$?
          case "$exitcode" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::terraform plan failed (exit code $exitcode)."; exit 1 ;;
          esac

      - name: terraform apply
        if: steps.plan.outputs.has_changes == 'true'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -lock-timeout=5m tfplan

  build:
    name: Build & push images
    needs: [checks, versions]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image reference for this service
        id: img
        run: |
          set -euo pipefail
          echo "ref=${IMAGE_NAMESPACE}/${{ matrix.service }}:${{ fromJSON(needs.versions.outputs.tags)[matrix.service] }}" >> "$GITHUB_OUTPUT"

      - name: Skip the build when the image already exists in GHCR
        id: probe
        run: |
          set -euo pipefail
          if docker manifest inspect "${{ steps.img.outputs.ref }}" >/dev/null 2>&1; then
            echo "${{ steps.img.outputs.ref }} already exists skipping the build."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ steps.img.outputs.ref }} is missing building."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.probe.outputs.found == 'false'

      - name: Build and push ${{ matrix.service }}
        if: steps.probe.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: apps/saas/${{ matrix.service }}
          file: apps/saas/${{ matrix.service }}/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.img.outputs.ref }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  scan:
    name: Scan images & SBOM
    needs: [versions, build]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image reference for this service
        id: img
        run: |
          set -euo pipefail
          echo "ref=${IMAGE_NAMESPACE}/${{ matrix.service }}:${{ fromJSON(needs.versions.outputs.tags)[matrix.service] }}" >> "$GITHUB_OUTPUT"

      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          trivy --version
      - name: Cache the Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-db-${{ env.TRIVY_VERSION }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-trivy-db-${{ env.TRIVY_VERSION }}-

      - name: Generer le SBOM CycloneDX de l'image
        run: |
          set -euo pipefail
          mkdir -p reports
          trivy image "${{ steps.img.outputs.ref }}" \
            --format cyclonedx \
            --output "reports/sbom-${{ matrix.service }}.cdx.json" \
            --cache-dir ~/.cache/trivy

      - name: Trivy - analyse de l'image (bloquant)
        id: image_scan
        run: |
          set -euo pipefail
          trivy image "${{ steps.img.outputs.ref }}" \
            --scanners vuln,secret \
            --severity "${TRIVY_BLOCKING_SEVERITY}" \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --cache-dir ~/.cache/trivy

      - name: Rapports de l'image (SARIF + JSON) et synthese
        if: always()
        run: |
          set -euo pipefail
          trivy image "${{ steps.img.outputs.ref }}" --scanners vuln,secret \
            --format sarif --output "reports/trivy-image-${{ matrix.service }}.sarif" \
            --cache-dir ~/.cache/trivy
          trivy image "${{ steps.img.outputs.ref }}" --scanners vuln,secret \
            --format json --output "reports/trivy-image-${{ matrix.service }}.json" \
            --cache-dir ~/.cache/trivy
          {
            echo "### Trivy - ${{ matrix.service }}"
            echo ""
            echo "Image analysee : \`${{ steps.img.outputs.ref }}\`"
            echo ""
            echo "| Severite | Vulnerabilites |"
            echo "|---|---|"
            for sev in CRITICAL HIGH MEDIUM LOW; do
              n=$(jq --arg s "$sev" '[.Results[]?.Vulnerabilities[]? | select(.Severity == $s)] | length' \
                "reports/trivy-image-${{ matrix.service }}.json")
              echo "| $sev | $n |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les resultats dans GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-image-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

      - name: Archiver le SBOM et les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ matrix.service }}
          path: reports/
          retention-days: 90

  provision:
    name: Provision ansible
    needs: terraform
    if: needs.terraform.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANSIBLE_HOST_KEY_CHECKING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible and boto3
        run: pip install --no-cache-dir "ansible-core>=2.16" boto3
      - name: Install Ansible collections
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: ansible-galaxy collection install -r requirements.yml
      - name: Provision the nodes and configure the Swarm
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: ansible-playbook -i localhost, playbook.yml

  deploy:
    name: Deploy ansible
    needs: [versions, build, scan, provision]
    if: >-
      !cancelled()
      && needs.versions.result == 'success'
      && needs.build.result == 'success'
      && needs.scan.result == 'success'
      && (needs.provision.result == 'success' || needs.provision.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      FRONTEND_IMAGE_TAG: ${{ fromJSON(needs.versions.outputs.tags).frontend }}
      BACKEND_IMAGE_TAG: ${{ fromJSON(needs.versions.outputs.tags).backend }}
      POSTGRES_DB_DROPICTURE_SAAS: ${{ secrets.POSTGRES_DB_DROPICTURE_SAAS }}
      POSTGRES_USER_DROPICTURE_SAAS: ${{ secrets.POSTGRES_USER_DROPICTURE_SAAS }}
      POSTGRES_PASSWORD_DROPICTURE_SAAS: ${{ secrets.POSTGRES_PASSWORD_DROPICTURE_SAAS }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      ANSIBLE_HOST_KEY_CHECKING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible and boto3
        run: pip install --no-cache-dir "ansible-core>=2.16" boto3
      - name: Install Ansible collections
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: ansible-galaxy collection install -r requirements.yml
      - name: Deploy the stack and run the migrations
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: ansible-playbook -i localhost, deploy.yml

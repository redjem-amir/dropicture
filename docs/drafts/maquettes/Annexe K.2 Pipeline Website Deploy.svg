l="#212529" text-anchor="start" letter-spacing="0">sync S3 · 3 passes cache</text><rect x="1372.7" y="274.0" width="215.3" height="24.0" rx="5" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/><text x="1378.7" y="289.0" font-family="'Roboto Flex','Helvetica Neue',Arial,sans-serif" font-size="7.5" font-weight="400" fill="#212529" text-anchor="start" letter-spacing="0">invalidation CloudFront /*</text><rect x="56.0" y="356.0" width="1542.0" height="40.0" rx="8" fill="#EBF5FF" stroke="#A5D8FF" stroke-width="1"/><text x="70.0" y="373.0" font-family="'Roboto Flex','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="600" fill="#1C7ED6" text-anchor="start" letter-spacing="0">Enchaînement</text><text x="176.0" y="373.0" font-family="'Roboto Flex','Helvetica Neue',Arial,sans-serif" font-size="8.5" font-weight="400" fill="#212529" text-anchor="start" letter-spacing="0">validate → build → bootstrap → plan → apply (conditionnel) → deploy · les jobs d&#x27;infra et de diffusion ne tournent pas sur les pull requests</text><text x="70.0" y="388.0" font-family="'Roboto Flex','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="600" fill="#1C7ED6" text-anchor="start" letter-spacing="0">Idempotence</text><text x="176.0" y="388.0" font-family="'Roboto Flex','Helvetica Neue',Arial,sans-serif" font-size="8.5" font-weight="400" fill="#212529" text-anchor="start" letter-spacing="0">sync S3 en trois passes de cache-control (assets immuables 1 an · autres 1 h · HTML sans cache) puis suppression des fichiers obsolètes, enfin invalidation CloudFront /*</text><text x="56.0" y="428.0" font-family="'Roboto Flex','Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="400" fill="#868E96" text-anchor="start" letter-spacing="0">Différence avec K.1 (SaaS Deploy) · pas de conteneur ni de registre, pas de scan Trivy sur ce périmètre statique, livraison automatique à chaque push plutôt que manuelle.</text><text x="56.0" y="452.0" font-family="'Roboto Mono',ui-monospace,monospace" font-size="7.5" font-weight="400" fill="#868E96" text-anchor="start" letter-spacing="0">Sources · .github/workflows/website-deploy.yml · infra/website/terraform · apps/website</text></svg>
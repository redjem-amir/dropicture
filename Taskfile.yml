version: "3"

output: prefixed

vars:
  SAAS: apps/saas
  WEBSITE: apps/website

tasks:
  backend:env:
    internal: true
    dir: "{{.SAAS}}/backend"
    status:
      - test -f .env
    cmds:
      - |
        cat > .env <<EOF
        POSTGRES_DB_DROPICTURE_SAAS="dropicture_saas"
        POSTGRES_HOST_DROPICTURE_SAAS="localhost"
        POSTGRES_PORT_DROPICTURE_SAAS="5432"
        PGBOUNCER_HOST_DROPICTURE_SAAS="localhost"
        PGBOUNCER_PORT_DROPICTURE_SAAS="6432"
        POSTGRES_USER_DROPICTURE_SAAS="$(openssl rand -hex 12)"
        POSTGRES_PASSWORD_DROPICTURE_SAAS="$(openssl rand -hex 12)"
        REDIS_CACHE_HOST_DROPICTURE_SAAS="localhost"
        AWS_REGION="eu-west-3"
        AWS_ACCESS_KEY_ID="..."
        AWS_SECRET_ACCESS_KEY="..."
        CDN_SSM_PREFIX="/dropicture/cloudfront"
        EOF
      - echo "→ apps/saas/backend/.env créé. Renseigne AWS_ACCESS_KEY_ID et AWS_SECRET_ACCESS_KEY avant de lancer 'task backend'."

  backend:up:
    internal: true
    deps: [backend:env]
    dir: "{{.SAAS}}/backend"
    cmds:
      - docker compose up -d --wait

  backend:
    desc: Démarre le backend NestJS
    dir: "{{.SAAS}}/backend"
    deps: [backend:up]
    cmds:
      - npm install
      - npm run migration:run
      - npm run start:dev

  frontend:
    desc: Démarre le frontend Next.js
    dir: "{{.SAAS}}/frontend"
    cmds:
      - |
        [ -f .env ] || cat > .env <<'EOF'
        NEXT_PUBLIC_API_URL="http://localhost:3002"
        EOF
      - npm install
      - npm run dev

  website:
    desc: Démarre le website Next.js
    dir: "{{.WEBSITE}}"
    cmds:
      - |
        [ -f .env ] || cat > .env <<'EOF'
        NEXT_PUBLIC_SAAS_BACKEND_URL="http://localhost:3002"
        NEXT_PUBLIC_SAAS_FRONTEND_URL="http://localhost:3001"
        EOF
      - npm install
      - npm run dev

  saas:
    desc: Setup complet + lance backend & frontend
    deps:
      - backend
      - frontend
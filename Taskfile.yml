version: "3"

output: prefixed

vars:
  SAAS: apps/saas
  WEBSITE: apps/website
  ENV: apps/saas/.env

tasks:
  env:
    desc: Génère le .env partagé du SaaS
    internal: true
    run: once
    status:
      - test -f {{.ENV}}
    cmds:
      - |
        cat > {{.ENV}} <<EOF
        POSTGRES_DB_DROPICTURE_SAAS="dropicture_saas"
        POSTGRES_HOST_DROPICTURE_SAAS="localhost"
        POSTGRES_PORT_DROPICTURE_SAAS="5432"
        PGBOUNCER_HOST_DROPICTURE_SAAS="localhost"
        PGBOUNCER_PORT_DROPICTURE_SAAS="6432"
        POSTGRES_USER_DROPICTURE_SAAS="$(openssl rand -hex 12)"
        POSTGRES_PASSWORD_DROPICTURE_SAAS="$(openssl rand -hex 12)"
        REDIS_CACHE_HOST_DROPICTURE_SAAS="localhost"
        REDIS_QUEUE_HOST_DROPICTURE_SAAS="localhost"
        AWS_REGION="eu-west-3"
        AWS_ACCESS_KEY_ID="..."
        AWS_SECRET_ACCESS_KEY="..."
        CDN_SSM_PREFIX="/dropicture/cloudfront"
        COOKIE_DOMAIN="localhost"
        NEXT_PUBLIC_API_URL="http://localhost:3002"
        EOF
      - echo "→ {{.ENV}} créé. Renseigne les clés AWS avant de lancer jobs."

  link:
    desc: Relie le .env partagé aux services
    internal: true
    run: once
    deps: [env]
    cmds:
      - ln -sfn ../.env {{.SAAS}}/backend/.env
      - ln -sfn ../.env {{.SAAS}}/jobs/.env

  infra:
    desc: Lance Postgres, pgbouncer et Redis
    internal: true
    run: once
    deps: [link]
    dir: "{{.SAAS}}/backend"
    cmds:
      - docker compose up -d --wait

  backend:
    desc: Démarre le backend NestJS
    dir: "{{.SAAS}}/backend"
    deps: [infra]
    cmds:
      - npm install
      - npm run migration:run
      - npm run start:dev

  jobs:
    desc: Démarre le worker de transcodage
    dir: "{{.SAAS}}/jobs"
    deps: [infra]
    cmds:
      - npm install
      - npm run start:dev

  frontend:
    desc: Démarre le frontend Next.js
    dir: "{{.SAAS}}/frontend"
    cmds:
      - npm install
      - npm run dev

  website:
    desc: Démarre le website Next.js
    dir: "{{.WEBSITE}}"
    cmds:
      - npm install
      - npm run dev

  reset:
    desc: Détruit la base et les identifiants générés
    dir: "{{.SAAS}}/backend"
    cmds:
      - docker compose down -v
      - rm -f ../.env ./.env ../jobs/.env

  saas:
    desc: Setup complet + lance backend, jobs & frontend
    deps:
      - backend
      - jobs
      - frontend
